services:
  app:
    build:
      context: .
      target: dev
    container_name: yashif-portfolio-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    stdin_open: true
    tty: true

  prod-preview:
    build:
      context: .
      target: runner
    container_name: yashif-portfolio-prod
    profiles: ["prod"]
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
